name: CI/CD

# Pull requests: tests + image builds only. No secrets, no registry push, no production access.
# Pushes to master: the same checks, then publish immutable images and roll the Portainer stack.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

env:
  IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'minipcer' }}

jobs:
  backend:
    name: Backend tests (JDK 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn clean verify
        working-directory: backend
        run: mvn -B -ntp clean verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: Production build (strict type/template check)
        working-directory: frontend
        run: npm run build

  deploy-script:
    name: Deploy script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck deploy/portainer-deploy.sh deploy/test/run-tests.sh
      - name: Rollout, rollback, crash-loop and stale-run scenarios against a mock Portainer
        run: bash deploy/test/run-tests.sh

  images-check:
    name: Docker images build (no push)
    if: github.event_name == 'pull_request'
    needs: [backend, frontend, deploy-script]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          push: false
          provenance: false

  publish:
    name: Publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [backend, frontend, deploy-script]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    # Only digests cross jobs: Actions drops outputs that contain a secret value, and the image
    # namespace equals the DOCKERHUB_USERNAME secret, so full image refs are rebuilt in deploy.
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - name: Require registry credentials
        env:
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          if [ "$HAS_DOCKERHUB" != "true" ]; then
            echo "::error::Missing secret DOCKERHUB_TOKEN (repository or 'production' environment). See docs/operations.md#required-github-settings"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || 'minipcer' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/cloudbase-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/cloudbase-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Record pinned image references
        run: |
          be="${IMAGE_NAMESPACE}/cloudbase-backend:${GITHUB_SHA}@${{ steps.backend.outputs.digest }}"
          fe="${IMAGE_NAMESPACE}/cloudbase-frontend:${GITHUB_SHA}@${{ steps.frontend.outputs.digest }}"
          {
            echo "### Images for \`${GITHUB_SHA}\`"
            echo "- backend digest: \`${{ steps.backend.outputs.digest }}\`"
            echo "- backend: \`$be\`"
            echo "- frontend digest: \`${{ steps.frontend.outputs.digest }}\`"
            echo "- frontend: \`$fe\`"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg sha "$GITHUB_SHA" --arg be "$be" --arg fe "$fe" '{commit:$sha, backend:$be, frontend:$fe}' > release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: release.json

  deploy:
    name: Deploy to production
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://www.cloudbase.website
    # One production rollout at a time; a newer queued run supersedes an older pending one,
    # and the script also refuses to replace a newer deployed commit with an older one.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require Portainer credentials
        env:
          HAS_PORTAINER: ${{ secrets.PORTAINER_API_KEY != '' }}
        run: |
          if [ "$HAS_PORTAINER" != "true" ]; then
            echo "::error::Missing secret PORTAINER_API_KEY (repository or 'production' environment). Images were published; nothing was deployed. See docs/operations.md#required-github-settings"
            exit 1
          fi
      - name: Roll Portainer stack
        id: rollout
        env:
          PORTAINER_URL: ${{ vars.PORTAINER_URL || 'https://manage.cloudbase.website' }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID || '3' }}
          PORTAINER_STACK_ID: ${{ vars.PORTAINER_STACK_ID || '44' }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DEPLOY_SHA: ${{ github.sha }}
          BACKEND_IMAGE: ${{ env.IMAGE_NAMESPACE }}/cloudbase-backend:${{ github.sha }}@${{ needs.publish.outputs.backend_digest }}
          FRONTEND_IMAGE: ${{ env.IMAGE_NAMESPACE }}/cloudbase-frontend:${{ github.sha }}@${{ needs.publish.outputs.frontend_digest }}
          HEALTH_API_URL: https://api.cloudbase.website
          HEALTH_WEB_URL: https://www.cloudbase.website
          GITHUB_TOKEN: ${{ github.token }}
        run: bash deploy/portainer-deploy.sh
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.rollout.outputs.skipped == 'false'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || 'minipcer' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Move :latest to the deployed images
        if: steps.rollout.outputs.skipped == 'false'
        env:
          BACKEND_DIGEST: ${{ needs.publish.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.publish.outputs.frontend_digest }}
        run: |
          docker buildx imagetools create -t "${IMAGE_NAMESPACE}/cloudbase-backend:latest" "${IMAGE_NAMESPACE}/cloudbase-backend@${BACKEND_DIGEST}"
          docker buildx imagetools create -t "${IMAGE_NAMESPACE}/cloudbase-frontend:latest" "${IMAGE_NAMESPACE}/cloudbase-frontend@${FRONTEND_DIGEST}"
          echo "Deployed \`${GITHUB_SHA}\` to production; :latest now points to it." >> "$GITHUB_STEP_SUMMARY"
