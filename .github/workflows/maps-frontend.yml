name: Verified Maps frontend deployment
on:
  push:
    branches: [master, ops/maps-frontend]
    paths: ['deploy/maps-frontend/**', 'deploy/maps-release.json', '.github/workflows/maps-frontend.yml']
  pull_request:
    branches: [master]
    paths: ['deploy/maps-frontend/**', 'deploy/maps-release.json', '.github/workflows/maps-frontend.yml']
permissions:
  contents: read
jobs:
  guard-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Frontend-only rollout and rollback safety cases
        run: node deploy/maps-frontend/test.cjs
  deploy:
    name: Deploy only the approved Maps frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: guard-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Verify, deploy and check both public languages
        env:
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node deploy/maps-frontend/run.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: maps-deployment-${{ github.sha }}
          path: maps-deployment.json
          if-no-files-found: ignore
          retention-days: 7
