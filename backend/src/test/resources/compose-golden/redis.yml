services:
  my-db:
    image: redis:7-alpine
    container_name: cb-svc-redis
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: "cb-svc-redis"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - /var/lib/cloudbase/users/u-owner1/proj-1/svc-redis:/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - project-proj-1
      - cloudbase
networks:
  project-proj-1:
    driver: bridge
  cloudbase:
    external: true
