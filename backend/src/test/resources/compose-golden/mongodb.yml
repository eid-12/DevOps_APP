services:
  my-db:
    image: mongo:7
    container_name: cb-svc-mongodb
    restart: 'no'
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: "cb-svc-mongodb"
    environment:
      MONGO_INITDB_ROOT_USERNAME: cbuser
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - /var/lib/cloudbase/users/u-owner1/proj-1/svc-mongodb:/data/db
    deploy:
      resources:
        limits:
          memory: 256M
          pids: '512'
    security_opt:
      - no-new-privileges:true
    networks:
      - project-proj-1
networks:
  project-proj-1:
    external: true
    name: project-proj-1
