services:
  my-db:
    image: mongo:7
    container_name: cb-svc-mongodb
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: "cb-svc-mongodb"
    environment:
      MONGO_INITDB_ROOT_USERNAME: cbuser
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - /var/lib/cloudbase/users/u-owner1/proj-1/svc-mongodb:/data/db
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - project-proj-1
      - cloudbase
networks:
  project-proj-1:
    driver: bridge
  cloudbase:
    external: true
