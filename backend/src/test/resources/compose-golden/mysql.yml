services:
  my-db:
    image: mysql:8.0
    container_name: cb-svc-mysql
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: "cb-svc-mysql"
    environment:
      MYSQL_DATABASE: my_db
      MYSQL_USER: cbuser
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - /var/lib/cloudbase/users/u-owner1/proj-1/svc-mysql:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - project-proj-1
      - cloudbase
networks:
  project-proj-1:
    driver: bridge
  cloudbase:
    external: true
