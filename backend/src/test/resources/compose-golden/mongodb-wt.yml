services:
  my-db:
    image: mongo:7
    container_name: cb-svc-mongodb
    restart: 'no'
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: "cb-svc-mongodb"
    environment:
      MONGO_INITDB_ROOT_USERNAME: cbuser
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - /var/lib/cloudbase/users/u-owner1/proj-1/svc-mongodb:/data/db
    deploy:
      resources:
        limits:
          memory: 256M
          pids: '512'
    security_opt:
      - no-new-privileges:true
    networks:
      - project-proj-1
  watchtower:
    image: nickfedor/watchtower:1.21.0
    container_name: cb-wt-svc-mongodb
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: "cb-svc-mongodb"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_REVIVE_STOPPED: "false"
      WATCHTOWER_POLL_INTERVAL: "300"
      DOCKER_API_VERSION: "1.44"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.10'
          pids: '512'
networks:
  project-proj-1:
    external: true
    name: project-proj-1
