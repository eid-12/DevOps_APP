services:
  my-db:
    image: mysql:8.0
    container_name: cb-svc-mysql
    restart: 'no'
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: "cb-svc-mysql"
    environment:
      MYSQL_DATABASE: my_db
      MYSQL_USER: cbuser
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - /var/lib/cloudbase/users/u-owner1/proj-1/svc-mysql:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 256M
          pids: '512'
    security_opt:
      - no-new-privileges:true
    networks:
      - project-proj-1
  watchtower:
    image: nickfedor/watchtower@sha256:d76a95a54ab636968f77cb1780fb597b3e28511b535a86e3af212a290ef4d743
    container_name: cb-wt-svc-mysql
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: "cb-svc-mysql"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_REVIVE_STOPPED: "false"
      WATCHTOWER_POLL_INTERVAL: "300"
      DOCKER_API_VERSION: "1.44"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.10'
          pids: '512'
networks:
  project-proj-1:
    external: true
    name: project-proj-1
