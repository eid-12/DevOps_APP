services:
  web-app:
    image: "minipcer/web-app-gh1:abc1234"
    container_name: cb-svc-gh1
    restart: 'no'
    pull_policy: always
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: "cb-svc-gh1"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
          pids: '512'
    volumes:
      - /var/lib/cloudbase/users/u-owner1/proj-1/svc-gh1:/data
    security_opt:
      - no-new-privileges:true
    networks:
      - project-proj-1
  watchtower:
    image: nickfedor/watchtower@sha256:d76a95a54ab636968f77cb1780fb597b3e28511b535a86e3af212a290ef4d743
    container_name: cb-wt-svc-gh1
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: "cb-svc-gh1"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_REVIVE_STOPPED: "false"
      WATCHTOWER_POLL_INTERVAL: "300"
      DOCKER_API_VERSION: "1.44"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.10'
          pids: '512'
networks:
  project-proj-1:
    external: true
    name: project-proj-1
