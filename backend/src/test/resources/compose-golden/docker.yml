services:
  web-app:
    image: "nginx:1.27-alpine"
    container_name: cb-svc-dock1
    restart: unless-stopped
    pull_policy: always
    command:
      - "node"
      - "server.js"
      - "--port"
      - "8080"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: "cb-svc-dock1"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    environment:
      API_URL: ${API_URL}
      SECRET_TOKEN: ${SECRET_TOKEN}
    volumes:
      - /var/lib/cloudbase/users/u-owner1/proj-1/svc-dock1:/app/data
    networks:
      - project-proj-1
      - cloudbase
networks:
  project-proj-1:
    driver: bridge
  cloudbase:
    external: true
