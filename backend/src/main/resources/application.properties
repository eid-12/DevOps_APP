spring.application.name=cloudbase-backend
server.port=8080

# Database - override in application-prod.properties or via env vars
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cloudbase}
spring.datasource.username=${DB_USER:cloudbase}
spring.datasource.password=${DB_PASS:cloudbase_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT session lifetime (default: 2 hours). Override via JWT_EXPIRATION_MS.
jwt.secret=${JWT_SECRET:cloudbase-dev-secret-min-32chars-padding}
jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# First-admin bootstrap (used only when no ADMIN user exists)
cloudbase.bootstrap.admin-email=${CLOUDBASE_BOOTSTRAP_ADMIN_EMAIL:}
cloudbase.bootstrap.admin-password=${CLOUDBASE_BOOTSTRAP_ADMIN_PASSWORD:}
cloudbase.require-prod-secrets=${CLOUDBASE_REQUIRE_PROD_SECRETS:false}

# Portainer
portainer.url=${PORTAINER_URL:http://localhost:9000}
portainer.api-key=${PORTAINER_API_KEY:}
portainer.endpoint-id=${PORTAINER_ENDPOINT_ID:1}

# Nginx Proxy Manager
# Accept both NPM_EMAIL and NPM_USER (common .env naming).
npm.enabled=${NPM_ENABLED:false}
npm.url=${NPM_URL:http://localhost:81}
npm.email=${NPM_EMAIL:${NPM_USER:}}
npm.password=${NPM_PASSWORD:}
npm.certificate-id=${NPM_CERTIFICATE_ID:0}
npm.ssl-forced=${NPM_SSL_FORCED:false}

# GitHub OAuth — preferred source is application.yml (github.oauth.*).
# Keep these as fallbacks when only .properties / env are used.
github.oauth.client-id=${GITHUB_CLIENT_ID:}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET:}
github.oauth.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:4200/auth/github/callback}
github.oauth.success-redirect=${GITHUB_SUCCESS_REDIRECT:http://localhost:4200/account?github=connected}
github.oauth.failure-redirect=${GITHUB_FAILURE_REDIRECT:http://localhost:4200/account?github=error}
github.oauth.scopes=${GITHUB_OAUTH_SCOPES:read:user repo user:email workflow}

# GitHub webhooks (auto-deploy)
github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}

# Resend email (mawrid.cloudbase.website)
resend.enabled=${RESEND_ENABLED:false}
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:CloudBase <noreply@mawrid.cloudbase.website>}
resend.domain=${RESEND_DOMAIN:mawrid.cloudbase.website}
resend.admin-notify=${RESEND_ADMIN_NOTIFY:}
resend.app-base-url=${APP_BASE_URL:http://localhost:4200}
resend.ensure-domain=${RESEND_ENSURE_DOMAIN:false}

# CloudBase platform topology
cloudbase.base-domain=${CLOUDBASE_BASE_DOMAIN:cloudbase.website}
cloudbase.docker.network=${CLOUDBASE_DOCKER_NETWORK:cloudbase}
cloudbase.volume.root=${CLOUDBASE_VOLUME_ROOT:/var/lib/cloudbase/users}
cloudbase.dockerhub.namespace=${CLOUDBASE_DOCKERHUB_NAMESPACE:${DOCKER_HUB_USERNAME:cloudbase}}
cloudbase.watchtower.enabled=${CLOUDBASE_WATCHTOWER_ENABLED:true}
# Public base URL of this API (no trailing slash) — required for GitHub webhook registration (B2)
cloudbase.public-api-url=${CLOUDBASE_PUBLIC_API_URL:}

# Docker Hub (push/pull private images — optional for public Hub pulls)
dockerhub.username=${DOCKER_HUB_USERNAME:}
dockerhub.token=${DOCKER_HUB_TOKEN:}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
